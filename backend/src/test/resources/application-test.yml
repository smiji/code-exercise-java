spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: 'create-drop'
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: 'jdbc:sqlite::memory:'

app:
  base-url: http://localhost:8080/

snowflake:
  worker-id: 2
  datacenter-id: 2
  epoch-reference: 1767225600
